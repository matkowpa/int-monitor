name: daily-monitor

on:
  schedule:
    # Times are POLISH (Europe/Warsaw). GitHub cron is UTC-only and does not
    # know DST, so each run time is split by season: EU summer time ~= Mar-Oct
    # (UTC+2), winter ~= Nov-Feb (UTC+1); off by a few days around the DST
    # switch weekends. NOTE: GitHub's cron rejects wrapping ranges, so the
    # winter months are written as the list 1,2,11,12 (not 11-2).
    #   08:30 PL = 06:30 UTC (CEST) / 07:30 UTC (CET)
    #   15:30 PL = 13:30 UTC (CEST) / 14:30 UTC (CET)
    - cron: "30 6 3-10 * *"       # 08:30 PL, Mar-Oct (CEST)
    - cron: "30 13 3-10 * *"      # 15:30 PL, Mar-Oct (CEST)
    - cron: "30 7 1,2,11,12 * *"  # 08:30 PL, Nov-Feb (CET)
    - cron: "30 14 1,2,11,12 * *" # 15:30 PL, Nov-Feb (CET)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily monitor (collect -> synthesize -> publish)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Optional: unlocks Instagram/TikTok in the last30days engine.
          SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
          # Optional: revives the engine's web/grounding source.
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          # Optional: Telegram notification on every published site update.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.run --push
