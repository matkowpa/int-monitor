name: daily-monitor

on:
  schedule:
    # 08:30 UTC daily (10:30 CEST / 09:30 CET)
    - cron: "30 8 * * *"
    # 15:30 UTC daily (17:30 CEST / 16:30 CET)
    - cron: "30 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily monitor (collect -> synthesize -> publish)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Optional: unlocks Instagram/TikTok in the last30days engine.
          SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
          # Optional: revives the engine's web/grounding source.
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: python -m src.run --push
