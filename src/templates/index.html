{% extends "base.html" %}
{% block content %}
<section class="report-card">
  <div class="report-head">
    <span class="report-date">{{ latest.date }}</span>
    <span class="tagline">latest daily brief</span>
  </div>
  <div class="report-body">{{ report_html | safe }}</div>
</section>
{% if older %}
<section class="archive">
  <h2>Previous days</h2>
  <ul>
    {% for m in older %}
    <li><a href="{{ base }}reports/{{ m.date }}.html">{{ m.date }}</a></li>
    {% endfor %}
  </ul>
</section>
{% endif %}
{% endblock %}
