<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site_title }}{% endblock %}</title>
<meta name="description" content="{{ site_description }}">
<link rel="stylesheet" href="{{ base }}static/style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ base }}index.html">{{ site_title }}</a>
    <span class="tagline">daily last30days brief</span>
  </div>
</header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
<footer class="site-footer">
  <div class="wrap">
    <p>Generated automatically by the int-monitor pipeline. Source links are inline;
       summaries are machine-generated and may contain errors — verify against the sources.</p>
  </div>
</footer>
</body>
</html>
