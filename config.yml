# Intrum AB Daily Monitor — configuration
# Everything the daily pipeline needs to run. Edit freely; no code changes required.

company: "Intrum AB"
report_language: "en"

# A news item is considered relevant when any of these terms (case-insensitive)
# appears in its title or snippet.
topic_terms:
  - "Intrum"
  - "Intrum AB"
  - "Intrum Justitia"
  - "INTRUM"

# RSS/Atom feeds polled every run. Per-feed failures only produce a warning.
# always_relevant: true -> skip the topic_terms filter (for company-owned feeds).
rss_sources:
  - name: "Google News (EN)"
    url: "https://news.google.com/rss/search?q=Intrum&hl=en-US&gl=US&ceid=US:en"
  - name: "Google News (SV)"
    url: "https://news.google.com/rss/search?q=Intrum&hl=sv-SE&gl=SE&ceid=SE:sv"
  - name: "NPL Confidential (Greek NPL/servicing trade press)"
    url: "https://nplconfidential.com/feed/"
  - name: "Intrum press releases (GlobeNewswire via Google News)"
    url: "https://news.google.com/rss/search?q=Intrum+site:globenewswire.com&hl=en-US&gl=US&ceid=US:en"

# "New since last publish" window. Items older than this are ignored
# (unless this is the very first run, which uses first_run_days).
lookback_hours: 48
first_run_days: 7
max_new_items: 40

# Social / alternative source screening (last30days engine).
social:
  topic: "Intrum AB"
  days: 30
  # Source whitelist passed via --search. Do NOT add social.subreddits here:
  # that flag switches Reddit from global full-text search (which finds Intrum
  # posts anywhere) to listing-scans of a few subs (which find none).
  # grounding (web) needs BRAVE_API_KEY or SERPER_API_KEY for the engine
  # (GitHub secret in CI; ~/.config/last30days/.env locally) - without a key
  # the source fails gracefully and the rest of the brief is unaffected.
  # Instagram/TikTok need SCRAPECREATORS_API_KEY (engine config locally,
  # repo secret in CI).
  search: "reddit,tiktok,instagram,youtube,hackernews,polymarket,github,grounding"
  # Fixed JSON query plan passed to the engine via --plan (skips its internal
  # LLM planner): guarantees every run searches community chatter AND
  # corporate/financial news AND transaction/market-structure stories (Cepal,
  # Greece, divestments). See engine-plan.json.
  plan: "engine-plan.json"
  # Hard cap on the evidence pack fed to the LLM (characters).
  evidence_max_chars: 35000

# LLM used to write the daily report (OpenRouter API).
# Any chat-capable model id from https://openrouter.ai/models works here.
llm:
  model: "z-ai/glm-5.3-flash"
  temperature: 0.2
  max_tokens: 8000
  api_key_env: "OPENROUTER_API_KEY"

# last30days engine source (cloned at runtime into .last30days/ when no local
# copy exists). Pin a git tag/commit hash for reproducible CI runs.
last30days:
  repo: "https://github.com/mvanhorn/last30days-skill"
  ref: "main"

# Static site metadata. base_url is the GitHub Pages project URL
# (prefix for css/report links).
site:
  title: "Intrum Daily Monitor"
  description: "A daily research brief on Intrum AB: what the internet said, day by day."
  base_url: "https://matkowpa.github.io/int-monitor/"
